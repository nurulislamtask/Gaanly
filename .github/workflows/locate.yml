name: Locate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gaanly/web exec vite build
      - run: |
          f=$(ls web/dist/assets/index-*.js | head -1)
          awk '{ print NR": "length($0) }' "$f" | head -40
          awk 'length($0) > 68809 { print "LONGLINE " NR; print substr($0, 68300, 800) }' "$f"
