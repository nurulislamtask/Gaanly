# Opens the Android build of the web app in a headless browser and reports console errors plus a screenshot.
name: Smoke

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gaanly/web exec vite build --mode native
      - run: |
          cd web/dist-native && (python3 -m http.server 4173 >/dev/null 2>&1 &)
          cd ../.. && mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > run.js <<'EOF'
          const { chromium } = require("playwright");
          const cors = { "access-control-allow-origin": "*", "access-control-allow-headers": "*", "access-control-allow-methods": "*", "access-control-expose-headers": "*" };
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            const p = await ctx.newPage();
            await p.route(/^https?:\/\/(?!localhost)/, async (route) => {
              const req = route.request();
              if (req.method() === "OPTIONS") return route.fulfill({ status: 204, headers: cors });
              try {
                const r = await route.fetch();
                await route.fulfill({ response: r, headers: { ...r.headers(), ...cors } });
              } catch { await route.abort(); }
            });
            p.on("pageerror", (e) => console.log("PAGEERROR", e.stack || e.message));
            await p.goto("http://localhost:4173/");
            await p.waitForTimeout(12000);
            console.log("ROOT CHILDREN", await p.evaluate(() => document.getElementById("root").childElementCount));
            await p.screenshot({ path: "/tmp/pw/home.png" });
            await p.evaluate(() => document.querySelector("main").scrollTo(0, 700));
            await p.waitForTimeout(800);
            await p.screenshot({ path: "/tmp/pw/home2.png" });
            const row = p.locator("main li button, main li [role=button]").first();
            await row.click({ timeout: 5000 }).catch((e) => console.log("rowclick", e.message));
            await p.waitForTimeout(6000);
            await p.screenshot({ path: "/tmp/pw/playing.png" });
            await p.locator("button[aria-label*='Open']").first().click({ timeout: 4000 }).catch((e) => console.log("openclick", e.message));
            await p.waitForTimeout(2500);
            await p.screenshot({ path: "/tmp/pw/sheet.png" });
            await b.close();
          })();
          EOF
          node run.js
      - name: Publish screenshots to the shots branch
        if: always()
        run: |
          cd /tmp && rm -rf shots && mkdir shots && cp /tmp/pw/*.png shots/ || true
          cd shots && git init -q -b shots && git config user.email ci@example.com && git config user.name ci
          git add . && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots
