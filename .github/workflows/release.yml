# Builds every download for a release tag (v1.0.0) and publishes them as a GitHub release:
# the Windows installer, the macOS apps (Apple Silicon and Intel), the Linux packages, the Android APK, the unsigned
# iOS app and the AltStore source (altstore.json) that lets iPhones update by themselves.
# Normally started by the "Publish a new version" workflow (Actions tab → Run workflow → type a version).
#
# Android: the APK is signed with a key kept in the repository (mobile/android/gaanly-update-key.jks) unless these
# repository secrets (Settings → Secrets and variables → Actions) hold your own:
#   GAANLY_KEYSTORE_BASE64    the .jks file, base64-encoded
#   GAANLY_KEYSTORE_PASSWORD  GAANLY_KEY_ALIAS  GAANLY_KEY_PASSWORD
# Always the same key: Android only installs an update signed like the version already on the phone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gaanly-desktop dist
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Windows"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Windows.exe 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Windows.exe, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ad-hoc signed (no Apple Developer ID): enough to run on Apple Silicon; Gatekeeper asks once.
      - run: pnpm --filter gaanly-desktop dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check downloads
        shell: bash
        run: |
          { echo "### macOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-macOS-*.dmg 2>/dev/null | wc -l)
          [ "$found" -eq 2 ] || { echo "::error::Expected 2 file(s) matching *-macOS-*.dmg, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AppImage and .deb, for x64 and arm64 (the arm64 ones are packaged here too: nothing is compiled).
      - run: pnpm --filter gaanly-desktop dist:linux
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Linux"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Linux-* 2>/dev/null | wc -l)
          [ "$found" -eq 4 ] || { echo "::error::Expected 4 file(s) matching *-Linux-*, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GAANLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "GAANLY_KEYSTORE_BASE64 is not set: signing with the key in the repository."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gaanly-release.jks"
          echo "GAANLY_KEYSTORE=$RUNNER_TEMP/gaanly-release.jks" >> "$GITHUB_ENV"
      - run: pnpm --filter @gaanly/mobile apk
        env:
          GAANLY_KEYSTORE_PASSWORD: ${{ secrets.GAANLY_KEYSTORE_PASSWORD }}
          GAANLY_KEY_ALIAS: ${{ secrets.GAANLY_KEY_ALIAS }}
          GAANLY_KEY_PASSWORD: ${{ secrets.GAANLY_KEY_PASSWORD }}
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Android"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Android.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Android.apk, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unsigned on purpose: AltStore, SideStore or Sideloadly sign it with the user's own Apple ID when installing.
      - run: pnpm --filter @gaanly/mobile ipa
      - name: Check downloads
        shell: bash
        run: |
          { echo "### iOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-iOS.ipa 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-iOS.ipa, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: release/*
          if-no-files-found: error

  release:
    needs: [windows, mac, linux, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: AltStore source for iPhone updates
        run: node scripts/altstore-source.mjs "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" downloads downloads/altstore.json
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: true
          generate_release_notes: true
          files: downloads/*
          fail_on_unmatched_files: true
