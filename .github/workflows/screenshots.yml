# Retakes the README screenshots from the real web app (with made-up music) and commits them to docs/screenshots.
# Actions tab → Screenshots → Run workflow.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the screenshot browser
        working-directory: scripts/shots
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Take the screenshots
        working-directory: scripts/shots
        run: node capture.mjs ../../docs/screenshots
      - name: Commit
        run: |
          rm -f docs/screenshots/_p*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Screenshots of Gaanly"
          git push
