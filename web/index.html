<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14112B" />
    <meta name="description" content="Your music, uninterrupted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gaanly" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gaanly</title>
    <script>
      // Safety net: if the app fails before it can draw anything, say why instead of leaving a blank screen.
      (function () {
        var errs = [];
        function show() {
          var r = document.getElementById("root");
          if (!errs.length || (r && r.childElementCount)) return;
          var d = document.createElement("div");
          d.style.cssText = "position:fixed;inset:0;z-index:99999;padding:24px;background:#06142e;color:#fff;font:14px system-ui;overflow:auto";
          d.textContent = "Gaanly could not start\n\n" + errs.join("\n\n") + "\n\n" + navigator.userAgent;
          d.style.whiteSpace = "pre-wrap";
          var b = document.createElement("button");
          b.textContent = "Reset app settings and reload";
          b.style.cssText = "display:block;margin-top:16px;padding:10px 18px;border-radius:999px;background:#fff;color:#000";
          b.onclick = function () { try { localStorage.clear(); } catch (e) {} location.reload(); };
          d.appendChild(b);
          document.body.appendChild(d);
        }
        window.addEventListener("error", function (e) { errs.push(String(e.message) + " (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")"); setTimeout(show, 1500); });
        window.addEventListener("unhandledrejection", function (e) { errs.push("Promise: " + String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
        setTimeout(function () { var r = document.getElementById("root"); if (r && !r.childElementCount) { if (!errs.length) errs.push("Nothing was drawn after 6 seconds (no error reported)."); show(); } }, 6000);
      })();
    </script>
    <script>
      try {
        var t = localStorage.getItem("gaanly:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // Before the app loads, so screen readers and the browser see the chosen language right away.
        var l = localStorage.getItem("gaanly:lang");
        if (l === "en" || l === "pt-BR" || l === "bn") document.documentElement.lang = l;
        // Appearance chosen in Settings, applied before the first paint.
        var css = localStorage.getItem("gaanly:accent-css");
        if (css) {
          var s = document.createElement("style");
          s.id = "gaanly-accent";
          s.textContent = css;
          document.head.appendChild(s);
        }
        var a = JSON.parse(localStorage.getItem("gaanly:appearance2") || "{}");
        if (a.compactSidebar === true) document.documentElement.dataset.rail = "compact";
        if (a.texture !== true) document.documentElement.dataset.texture = "off";
        if (a.glass !== true) document.documentElement.dataset.glass = "off";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
